id: nixos-test-test-script-bind-host-pkgs
language: Nix
rule:
  all:
    - pattern:
        context: "{ testScript = $SCRIPT; }"
        selector: binding
    - inside:
        matches: nixos-test-outer-function
        stopBy: end
    - not:
        inside:
          kind: binding
          stopBy: end
fix: |-
  testScript =
    let
      pkgs = hostPkgs;
    in
    $SCRIPT;

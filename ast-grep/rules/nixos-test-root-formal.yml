id: nixos-test-root-formal
language: Nix
# An identifier in the outer function's argument set.
rule:
  all:
    - kind: identifier
    - inside:
        all:
          - kind: formal
          - inside:
              all:
                - kind: formals
                - inside:
                    matches: nixos-test-outer-function
                    stopBy: neighbor
              stopBy: neighbor
        stopBy: neighbor

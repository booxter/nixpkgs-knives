id: nixos-test-root-pkgs-use
language: Nix
# Actual uses of outer pkgs, excluding its formal, attribute names, and shadows.
rule:
  all:
    - kind: identifier
    - regex: "^pkgs$"
    - inside:
        matches: nixos-test-outer-function
        stopBy: end
    - not:
        inside:
          kind: formal
          stopBy: neighbor
    - not:
        inside:
          kind: attrpath
          stopBy: neighbor
    - not:
        inside:
          matches: nixos-test-pkgs-shadowing-function
          stopBy: end

id: nixos-test-pkgs-lib-member
language: Nix
# pkgs.lib.members -> lib.members
rule:
  all:
    - pattern: pkgs.lib.$$$MEMBERS
    - inside:
        matches: nixos-test-outer-function
        stopBy: end
    - not:
        inside:
          matches: nixos-test-pkgs-shadowing-function
          stopBy: end
fix: lib.$$$MEMBERS

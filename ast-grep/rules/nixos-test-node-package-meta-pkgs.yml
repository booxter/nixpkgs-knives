id: nixos-test-node-package-meta-pkgs
language: Nix
# Outer pkgs used to read metadata from a package in the default node package set.
rule:
  all:
    - kind: identifier
    - regex: "^pkgs$"
    - inside:
        matches: nixos-test-outer-function
        stopBy: end
    - not:
        inside:
          matches: nixos-test-pkgs-shadowing-function
          stopBy: end
    - inside:
        pattern: pkgs.$PACKAGE.meta
        stopBy: end
fix: config.node.pkgs
